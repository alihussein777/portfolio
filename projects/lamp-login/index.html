<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lamp Login</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body data-on="false">
  <div class="noise"></div>
  <div class="particles"></div>

  <main class="wrap">
    <section class="scene">
      <div class="glow"></div>

      <div class="lamp-area">
        <div class="lamp">
          <div class="shade"></div>
          <div class="light-cone"></div>
          <div class="stem"></div>
          <div class="base"></div>

          <button class="chain" id="chain" aria-label="Toggle lamp">
            <span class="wire"></span>
            <span class="ball"></span>
          </button>
        </div>

        <p class="hint"></p>
      </div>

      <section class="card" id="card">
        <span class="badge">SECURE ACCESS</span>
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to continue to your workspace</p>

        <label>
          <span>Username</span>
          <input type="text" placeholder="Enter username" />
        </label>

        <label>
          <span>Password</span>
          <input type="password" placeholder="••••••••" />
        </label>

        <button class="btn" type="button">Sign In</button>

        <p class="forgot">Forgot password?</p>
      </section>
    </section>
  </main>

  <audio id="clickSound" preload="auto">
    <source src="click.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
