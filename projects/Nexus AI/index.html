<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus AI Dashboard</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <span>Nexus</span>AI
        </div>

        <nav>

            <a href="#" class="active">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </a>

            <a href="#">
                <i class="fa-solid fa-robot"></i>
                AI Tools
            </a>

            <a href="#">
                <i class="fa-solid fa-folder"></i>
                Projects
            </a>

            <a href="#">
                <i class="fa-solid fa-chart-pie"></i>
                Analytics
            </a>

            <a href="#">
                <i class="fa-solid fa-gear"></i>
                Settings
            </a>

        </nav>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">

            <div>
                <h1>AI Dashboard</h1>
                <p>Welcome back, Ali 👋</p>
            </div>

            <button class="upgrade-btn">
                Upgrade Pro
            </button>

        </header>

        <!-- STATS -->
        <section class="stats">

            <div class="card">
                <h3>Projects</h3>
                <h2>24</h2>
            </div>

            <div class="card">
                <h3>AI Usage</h3>
                <h2>87%</h2>
            </div>

            <div class="card">
                <h3>Tasks</h3>
                <h2>13</h2>
            </div>

            <div class="card">
                <h3>Storage</h3>
                <h2>1.8TB</h2>
            </div>

        </section>

        <!-- AI SECTION -->
        <section class="ai-box">

            <div class="ai-content">

                <h2>Nexus AI Assistant</h2>

                <p>
                    Your futuristic AI workspace with analytics,
                    automation, and smart productivity tools.
                </p>

                <button>
                    Launch AI
                </button>

            </div>

            <div class="ai-glow"></div>

        </section>

    </main>

</body>

</html>
